services:
  api:
    build:
      context: .
      dockerfile: src/Industrial.Asrs.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
  web:
    build:
      context: src/industrial-asrs-web
      args:
        VITE_API_URL: http://127.0.0.1:8080
    ports:
      - "3000:80"
    depends_on:
      - api
