name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/industrial-asrs-web/package-lock.json }
      - run: dotnet restore Industrial.Asrs.Wcs.sln
      - run: dotnet build Industrial.Asrs.Wcs.sln -c Release --no-restore
      - run: dotnet test Industrial.Asrs.Wcs.sln -c Release --no-build
      - run: npm ci
        working-directory: src/industrial-asrs-web
      - run: npm run build
        working-directory: src/industrial-asrs-web
